name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Every check CI makes passes before anything is built.
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    # muse.app builds on macOS only; GoReleaser cross-compiles Linux from here.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # GhosttyKit takes most of the build; it changes only with its pin or patches.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/Vendor
          key: ghosttykit-${{ runner.arch }}-${{ hashFiles('macos/GHOSTTY_VERSION', 'macos/patches/ghostty/*.patch') }}
      # A throwaway keychain holds the Developer ID identity and the notary
      # credentials that macos/scripts/sign.sh reads from the environment.
      - name: Set up signing and notarization
        env:
          # base64 of the Developer ID Application certificate exported as .p12.
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # An App Store Connect API key (.p8 contents) for notarytool.
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          # notarytool reads its profile from the default keychain.
          security default-keychain -d user -s "$keychain"

          # The SHA-1 rather than the name, as sign.sh does.
          identity=$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/^ *[0-9][0-9]*) \([0-9A-F]\{40\}\) "Developer ID Application: .*/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "MACOS_CERTIFICATE_P12 holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "MUSE_CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

          printf '%s\n' "$APPLE_NOTARY_KEY" >"$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials muse-notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/notary.p8"
          echo "MUSE_NOTARY_PROFILE=muse-notary" >>"$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Written only after the release is published, so the tap never names an
      # asset that is not there. A failure here leaves the cask on the previous
      # version.
      - name: Write the Homebrew cask
        env:
          # A fine-grained token with contents: write on sglavoie/homebrew-tap.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          python3 scripts/homebrew_cask.py "$version" dist/checksums.txt >dist/muse-player.rb
          cat dist/muse-player.rb
          path=Casks/muse-player.rb
          # The first release under this token creates the file: it has no sha yet.
          if ! current=$(gh api "repos/sglavoie/homebrew-tap/contents/$path" --jq .sha 2>/dev/null); then
            current=
          fi
          gh api --method PUT "repos/sglavoie/homebrew-tap/contents/$path" \
            -f message="muse-player $version" \
            -f content="$(base64 <dist/muse-player.rb | tr -d '\n')" \
            ${current:+-f sha="$current"} >/dev/null
