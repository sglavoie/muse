version: "2"
run:
  timeout: 3m
linters:
  enable:
    - cyclop
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nestif
    - nolintlint
    - staticcheck
    - unused
  settings:
    cyclop:
      max-complexity: 10
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - os.Remove
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv
        - os.Chmod
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    gosec:
      excludes:
        - G104 # covered by errcheck linter
        - G204 # subprocess commands are hardcoded ("mpv")
        - G301 # directory permissions >0750 are fine in tests
        - G304 # file paths come from config, not user input
        - G306 # file permissions >0600 are fine in tests
    nestif:
      min-complexity: 4
    staticcheck:
      checks:
        - "all"
        - "-ST1000" # package comments — not required for internal packages
        - "-ST1003" # naming conventions — noisy for test variables
        - "-ST1023" # omit type from declaration — too noisy for test helpers
        - "-QF1001" # De Morgan's law — less readable in test assertions
        - "-QF1003" # tagged switch — style preference
        - "-QF1011" # omit type from declaration (v2 rename of ST1023)
  exclusions:
    rules:
      - linters:
          - errcheck
        text: "Error return value of .*.Close"
      - linters:
          - errcheck
        text: "Error return value of .*.Write"
        path: "internal/library/hasher\\.go"
      # Complexity linters do not apply to tests.
      - linters:
          - cyclop
          - funlen
          - gocognit
          - nestif
        path: _test\.go
      # Complexity debt. Each path is a file predating these linters.
      # Delete entries as they are decomposed; never add one.
      # Generated with the pinned golangci-lint v2.13.1 via
      # `just lint-complexity`. Starting file count: 175
      - linters:
          - cyclop
          - funlen
          - gocognit
          - nestif
        path: ^(internal/app/audit\.go|internal/app/bridge_scan\.go|internal/app/bridge_watch\.go|internal/app/library_walk\.go|internal/app/session\.go|internal/app/shutdown\.go|internal/app/startup_helpers\.go|internal/app/startup\.go|internal/config/config_load\.go|internal/config/config_validate_values\.go|internal/config/validate\.go|internal/db/smart_eval\.go|internal/db/smartrule\.go|internal/db/writer_play_history\.go|internal/db/writer_playlist\.go|internal/db/writer_queue_order\.go|internal/db/writer_tags\.go|internal/db/writer_tracks\.go|internal/db/writer\.go|internal/desktop/clipboard\.go|internal/insights/quality\.go|internal/insights/rankings\.go|internal/insights/rhythm\.go|internal/insights/trends\.go|internal/library/alltags\.go|internal/library/exclude\.go|internal/library/exiftool\.go|internal/library/ffprobe_extractor\.go|internal/library/filterquery\.go|internal/library/fuzzy_fake\.go|internal/library/fuzzy_sahilm\.go|internal/library/hasher\.go|internal/library/scanner\.go|internal/library/walker\.go|internal/library/watcher\.go|internal/metaexport/diff\.go|internal/metaexport/parse\.go|internal/player/ipc\.go|internal/player/mpv_controls\.go|internal/player/mpv_events\.go|internal/player/mpv_queue_playback\.go|internal/player/mpv_queue_prefetch\.go|internal/player/mpv_runtime_connect\.go|internal/player/mpv_runtime_health\.go|internal/player/preview\.go|internal/player/shuffle\.go|internal/radio/radio\.go|internal/recommendation/scoring\.go|internal/tui/debug\.go|internal/tui/insights/insights_health\.go|internal/tui/insights/insights_panels\.go|internal/tui/insights/insights_render\.go|internal/tui/insights/insights_sessions\.go|internal/tui/mixes/mixes\.go|internal/tui/overlay/goto_modal\.go|internal/tui/overlay/help\.go|internal/tui/overlay/overlay\.go|internal/tui/palette/command_palette\.go|internal/tui/palette/score\.go|internal/tui/palette/usage\.go|internal/tui/root_actions\.go|internal/tui/root_audit\.go|internal/tui/root_command_pal