# Builds release binaries when a v* tag is pushed (.github/workflows/release.yml).
# Check locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

before:
  hooks:
    - go mod tidy -diff

builds:
  # Windows is not supported: muse drives mpv over a Unix socket.
  - &build
    id: muse
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # The tag keeps its v, matching `go install …@v0.2.0` and `just release`.
      - -X main.Version={{ .Tag }}
      - -X main.BuildTime={{ .Date }}
  - <<: *build
    id: muse-darwin
    goos: [darwin]

# One universal macOS muse, which muse.app bundles: the hook builds, signs and
# (with MUSE_NOTARY_PROFILE set) notarizes macos/build/muse.app around it, so
# releases run on macOS (.github/workflows/release.yml).
universal_binaries:
  - id: muse-darwin
    ids: [muse-darwin]
    replace: true
    hooks:
      post:
        - cmd: ./macos/scripts/build-app.sh Release
          env:
            - MUSE_BINARY={{ .Path }}
          output: true

archives:
  - id: linux
    ids: [muse]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.example.toml
  - id: darwin
    ids: [muse-darwin]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.example.toml
      # GoReleaser drops the matches' common directory, Contents, so dst names it.
      - src: macos/build/muse.app/**/*
        dst: muse.app/Contents

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      # With or without a scope, as in chore(deps): from Dependabot.
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"

# No homebrew_casks: the cask's token is muse-player, and on macOS it links the
# notarized muse inside muse.app, which GoReleaser's cask cannot express, so
# release.yml writes Casks/muse-player.rb (scripts/homebrew_cask.py) once the
# release is published.
