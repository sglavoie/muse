# Builds release binaries when a v* tag is pushed (.github/workflows/release.yml).
# Check locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

before:
  hooks:
    - go mod tidy -diff

builds:
  # Windows is not supported: muse drives mpv over a Unix socket.
  - &build
    id: muse
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # The tag keeps its v, matching `go install …@v0.2.0` and `just release`.
      - -X main.Version={{ .Tag }}
      - -X main.BuildTime={{ .Date }}
  - <<: *build
    id: muse-darwin
    goos: [darwin]

# One universal macOS muse, which muse.app bundles: the hook builds, signs and
# (with MUSE_NOTARY_PROFILE set) notarizes macos/build/muse.app around it, so
# releases run on macOS (.github/workflows/release.yml).
universal_binaries:
  - id: muse-darwin
    ids: [muse-darwin]
    replace: true
    hooks:
      post:
        - cmd: ./macos/scripts/build-app.sh Release
          env:
            - MUSE_BINARY={{ .Path }}
          output: true

archives:
  - id: linux
    ids: [muse]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.example.toml
  - id: darwin
    ids: [muse-darwin]
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.example.toml
      # GoReleaser drops the matches' common directory, Contents, so dst names it.
      - src: macos/build/muse.app/**/*
        dst: muse.app/Contents

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      # With or without a scope, as in chore(deps): from Dependabot.
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"

homebrew_casks:
  - repository:
      owner: sglavoie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/sglavoie/muse
    description: Keyboard-driven terminal music player for your local library
    license: MIT
    # mpv plays; ExifTool is the recommended metadata backend (ffprobe also works).
    dependencies:
      - formula: mpv
      - formula: exiftool
    # muse.app goes to /Applications, so Finder, Spotlight and launchers find it.
    custom_block: |
      on_macos do
        app "muse.app"
      end
    hooks:
      post:
        # The binaries are not notarized: let macOS run them.
        # install_steps writes Homebrew's postflight_steps; install wrote the
        # deprecated postflight, which warns on every install.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/muse"]
          end
