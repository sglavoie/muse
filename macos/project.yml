# XcodeGen spec for muse.app. `just mac-app` generates macos/muse.xcodeproj from
# it; the generated project is gitignored, so edit this file instead.
name: muse
options:
  bundleIdPrefix: io.github.sglavoie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  muse:
    type: application
    platform: macOS
    sources:
      - path: MuseApp
        excludes:
          - Resources/muse-launch
      # The launcher muse runs under, copied executable into Resources.
      - path: MuseApp/Resources/muse-launch
        buildPhase: resources
      # Shown in the About panel.
      - path: NOTICE-ghostty
        buildPhase: resources
      # Ghostty's themes, shell integration, and terminfo, found by libghostty
      # beside the terminfo sentinel; vendored by build-ghosttykit.sh.
      - path: Vendor/resources/ghostty
        type: folder
        buildPhase: resources
      - path: Vendor/resources/terminfo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: muse
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.muse
        INFOPLIST_FILE: MuseApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # libghostty.a is built by Zig and carries C++ objects but no autolink
        # entries, so its runtime dependencies are spelled here.
        OTHER_LDFLAGS: ["-lc++"]
    dependencies:
      # Static library: linked, never embedded. Its Headers/module.modulemap
      # exposes `import GhosttyKit`, so no bridging header is needed.
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework
    scheme:
      testTargets:
        - MuseAppTests
  MuseAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MuseAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.muse.tests
    dependencies:
      - target: muse
      # For `import GhosttyKit` in tests. The hosting app already links the
      # static library, so linking it again would duplicate its symbols.
      - framework: Vendor/GhosttyKit.xcframework
        link: false
        embed: false
